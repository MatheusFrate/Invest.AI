[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-ai"
version = "2.0.0"
description = "Copiloto inteligente de investimentos e apuração de DARF da B3 com PydanticAI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.14.0",
    "pydantic-ai>=2.66.0",
    "python-dotenv>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "customtkinter>=5.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
