name: CI - Testes e Validação de Agentes

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pydantic pydantic-ai python-dotenv openpyxl pandas pytest

    - name: Executar Suíte de Testes (Pytest)
      run: |
        pytest -v
